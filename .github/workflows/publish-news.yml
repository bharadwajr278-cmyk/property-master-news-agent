name: Publish Property Master news

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without publishing
        required: false
        default: true
        type: boolean
  schedule:
    # Run automatically every five minutes (UTC).
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: property-master-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PROPERTY_MASTER_API_URL: https://api.propertymaster.com/api/news
      MAX_AGE_HOURS: 6
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Research, validate, and publish
        run: npm start
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-run-${{ github.run_id }}
          path: run-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Persist successful fingerprints
        if: success() && env.DRY_RUN != 'true'
        run: |
          if git diff --quiet -- data/fingerprints.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fingerprints.json
          git commit -m "chore: store published news fingerprints"
          git pull --rebase
          git push
